<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum vitae</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arsenal:ital,wght@0,400;0,700;1,400;1,700&family=DM+Serif+Display:ital@0;1&family=Dosis:wght@200..800&family=Libertinus+Sans:ital,wght@0,400;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Libre+Caslon+Display&family=Lora:ital,wght@0,400..700;1,400..700&family=Ribeye&display=swap" rel="stylesheet">
    <style>
         body {
            font-family: "Libertinus Sans", sans-serif;
            background-color: #f8f9fa;
        }
        h2, h3 {
            font-family: "Libertinus Sans", sans-serif;
            font-weight: 700;
        }
        .accordion-button:not(.collapsed) {
            background-color: #0d6efd;
            color: white;
        }
        .section-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
        }
        .experience-section {
            border: 2px dashed #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: border-color 0.3s;
        }
        .experience-section:hover {
            border-color: #0d6efd;
        }
    </style>
</head>
<body>

    <div class="bg-info-subtle">
        <nav class="d-flex justify-content-between p-4 shadow">
            <h3 class="align-content-center">Curriculum Vitae</h3>
            <div>
                <a th:href="@{/api/lista}" class="btn btn-primary m-2">Lista de CV</a>
            </div>
        </nav>
    </div>

    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0 text-center">Crea Tu Curriculum Vitae Completo</h2>
            </div>
            <!-- formulario -->
             <form th:action="@{/api/create-cv}" method="post" th:object="${curriculum}" enctype="multipart/form-data" class="bg-white p-4 rounded ">

                <!-- ACORDION PRINCIPAL -->
                 <div class="accordion mb-3" id="curriculumAccordion">

                    <!-- ACORDION INFORMACIÓN PERSONAL -->

                    <div class="accordion-item">
                        <h2 class="accordion-header" >
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#datosPersonales" aria-expanded="true">
                        <strong>1.Información Personal</strong>
                        </button>
                        </h2>
                        <div id="datosPersonales" class="accordion-collapse collapse show">
                            <div class="accordion-body">
                                <div class="row mb-3">
                                    <div class="col-6">
                                        <label class="form-label">Nombre *</label>
                                        <input placeholder="Ej.Sofia Daniela" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                            class="form-control" type="text" th:field="*{nombre}"  >
                                         <span class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                                    </div>
                    
                                    <div class="col-6">
                                        <label class="form-label">Apellido *</label>
                                        <input placeholder="Ej.Clavijo Granados" th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid' : ''"
                                            class="form-control" type="text" th:field="*{apellido}"  >
                                        <span class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-6">
                                        <label class="form-label">Titulo *</label>
                                        <input   th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid' : ''"
                                            class="form-control" type="text" th:field="*{titulo}"  placeholder="Ej.Ingeniero de Software" >
                                        <span class="invalid-feedback" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>

                                    </div>
                    
                                    <div class="col-6">
                                        <label class="form-label">Email *</label>
                                        <input th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                            class="form-control" type="email" th:field="*{email}" placeholder="Ej.CorreoReal@gmail.com" required>
                                        <span class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-4">
                                        <label class="form-label">Telefono *</label>
                                        <input th:classappend="${#fields.hasErrors('numeroTel')} ? 'is-invalid' : ''"
                                            class="form-control" type="text" th:field="*{numeroTel}" placeholder=" 300 123 4567" required>
                                        <span class="invalid-feedback" th:if="${#fields.hasErrors('numeroTel')}" th:errors="*{numeroTel}"></span>

                                    </div>

                                    <div class="col-4">
                                        <label class="form-label">País *</label>
                                        <select th:field="*{pais}" class="form-select" required>
                                            <option value="">Seleccionar país</option>
                                            <option th:each="pais : ${paises}" th:value="${pais}" th:text="${pais}"></option>
                                        </select>
                                        <span class="invalid-feedback" th:if="${#fields.hasErrors('pais')}" th:errors="*{pais}"></span>
                                    </div>

                                    <div class="col-4">
                                        <label class="form-label">LinkedIn *</label>
                                        <input th:classappend="${#fields.hasErrors('linkedin')} ? 'is-invalid' : ''"
                                            class="form-control" type="text" th:field="*{linkedin}"  placeholder="https://linkedin.com/in/tu-perfil" required>
                                        <span class="invalid-feedback" th:if="${#fields.hasErrors('linkedin')}" th:errors="*{linkedin}"></span>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Imagen de Perfil *</label>
                                    <input class="form-control"  type="file" name="file"  required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ACORDION PERFIL PROFESIONAL -->

                    <div class="accordion-item">
                        <h2 class="accordion-header" >
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#perfilProfesional" aria-expanded="false">
                        <strong>2.Perfil Profesional</strong>
                        </button>
                        </h2>
                        <div id="perfilProfesional" class="accordion-collapse collapse">
                            <div class="accordion-body">

                                <div class="row mb-2">
                                    <div class="mb-2">
                                        <label class="form-label">Sobre mí *</label>
                                        <textarea th:classappend="${#fields.hasErrors('perfil.sobreMi')} ? 'is-invalid' : ''"
                                                class="form-control" th:field="*{perfil.sobreMi}" placeholder="Describe brevemente tu experiencia, objetivos profesionales y lo que te distingue..." rows="4" required></textarea>
                                        <span class="invalid-feedback" th:if="${#fields.hasErrors('perfil.sobreMi')}" th:errors="*{perfil.sobreMi}"></span>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-8">
                                        <label class="form-label">Habilidades Técnicas *</label>
                                        <input th:classappend="${#fields.hasErrors('perfil.habilidades')} ? 'is-invalid' : ''"
                                            type="text" class="form-control" th:field="*{perfil.habilidades}" placeholder="Java, Spring Boot, MySQL, HTML, CSS, JavaScript..." required>
                                        <span class="invalid-feedback" th:if="${#fields.hasErrors('perfil.habilidades')}" th:errors="*{perfil.habilidades}"></span>
                                    </div>
                    
                                    <div class="col-md-4">
                                        <label class="form-label">Idiomas *</label>
                                        <select th:field="*{perfil.idioma}" class="form-select" required>
                                            <option value="">Seleccionar Idioma</option>
                                            <option th:each="idioma : ${idiomas}" th:value="${idioma}" th:text="${idioma}"></option>
                                        </select>
                                        <span class="invalid-feedback" th:if="${#fields.hasErrors('perfil.idioma')}" th:errors="*{perfil.idioma}"></span>
                                    </div>
                                </div>

                                <div class="bg-light p-3 rounded">
                                    <h6 class="fw-bold">Referencias</h6>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <label class="form-label">Nombre de la Referencia *</label>
                                            <input th:classappend="${#fields.hasErrors('perfil.nombreRef')} ? 'is-invalid' : ''"
                                            class="form-control" type="text" th:field="*{perfil.nombreRef}" placeholder="Ej.Mario Calderón" required>
                                            <span class="invalid-feedback" th:if="${#fields.hasErrors('perfil.nombreRef')}" th:errors="*{perfil.nombreRef}"></span>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Telefono de la Referencia *</label>
                                            <input th:classappend="${#fields.hasErrors('perfil.numeroRef')} ? 'is-invalid' : ''"
                                            class="form-control" type="text" th:field="*{perfil.numeroRef}"  placeholder="301 234 5678" required>
                                            <span class="invalid-feedback" th:if="${#fields.hasErrors('perfil.numeroRef')}" th:errors="*{perfil.numeroRef}"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ACORDION EXPERIENCIA -->

                    <div class="accordion-item">
                        <h2 class="accordion-header" >
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#experienciaLaboral"  aria-expanded="false">
                        <strong>3.Experiencia Laboral</strong>
                        <span class="badge bg-secondary ms-2">Máx. 3 empleos</span>
                        </button>
                        </h2>
                        <div id="experienciaLaboral" class="accordion-collapse collapse">
                            <div class="accordion-body">

                                <!-- Primera Experiencia -->
                                <div class="experience-section">
                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <h6 class="fw-bold text-primary mb-0">Experiencia #1</h6>
                                            <small class="text-muted">Más reciente</small>
                                        </div>
                                    

                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Nombre de la Empresa *</label>
                                            <input th:classappend="${#fields.hasErrors('experiencias[0].nombreEmpresa')} ? 'is-invalid' : ''"
                                            class="form-control" type="text" th:field="*{experiencias[0].nombreEmpresa}" placeholder="Ej. Globant" required>
                                            <span class="invalid-feedback" th:if="${#fields.hasErrors('experiencias[0].nombreEmpresa')}" th:errors="*{experiencias[0].nombreEmpresa}"></span>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Cargo/Posición *</label>
                                            <input th:classappend="${#fields.hasErrors('experiencias[0].nombreCargo')} ? 'is-invalid' : ''"
                                            class="form-control" type="text" th:field="*{experiencias[0].nombreCargo}" placeholder="Ej. Desarrollador Full Stack" required>
                                            <span class="invalid-feedback" th:if="${#fields.hasErrors('experiencias[0].nombreCargo')}" th:errors="*{experiencias[0].nombreCargo}"></span>
                                        </div>
                                    </div>

                                    <div class="row mb-3">
                                        <div class="col-md-4">
                                            <label class="form-label">Fecha de Inicio *</label>
                                            <input th:classappend="${#fields.hasErrors('experiencias[0].fechaInicio')} ? 'is-invalid' : ''"
                                            class="form-control" type="date" th:field="*{experiencias[0].fechaInicio}"required>
                                        </div>
                        
                                        <div class="col-md-8">
                                            <label class="form-label">Descripción de Responsabilidades *</label>
                                            <textarea th:classappend="${#fields.hasErrors('experiencias[0].descripcion')} ? 'is-invalid' : ''"
                                                class="form-control" th:field="*{experiencias[0].descripcion}" placeholder="Describe tus principales logros y responsabilidades..." rows="2" required></textarea>
                                            <span class="invalid-feedback" th:if="${#fields.hasErrors('experiencias[0].descripcion')}" th:errors="*{experiencias[0].descripcion}"></span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Segunda Experiencia -->
                                <div class="experience-section">
                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <h6 class="fw-bold text-primary mb-0">Experiencia #2</h6>
                                            <small class="text-muted">Otro</small>
                                        </div>
                                    

                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Nombre de la Empresa </label>
                                            <input th:classappend="${#fields.hasErrors('experiencias[1].nombreEmpresa')} ? 'is-invalid' : ''"
                                            class="form-control" type="text" th:field="*{experiencias[1].nombreEmpresa}"  placeholder="Ej. Pragma" >
                                            <span class="invalid-feedback" th:if="${#fields.hasErrors('experiencias[1].nombreEmpresa')}" th:errors="*{experiencias[1].nombreEmpresa}"></span>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Cargo/Posición </label>
                                            <input th:classappend="${#fields.hasErrors('experiencias[1].nombreCargo')} ? 'is-invalid' : ''"
                                            class="form-control" type="text" th:field="*{experiencias[1].nombreCargo}"  placeholder="Ej. Desarrollador Full Stack">
                                            <span class="invalid-feedback" th:if="${#fields.hasErrors('experiencias[1].nombreCargo')}" th:errors="*{experiencias[1].nombreCargo}"></span>
                                        </div>
                                    </div>

                                    <div class="row mb-3">
                                        <div class="col-md-4">
                                            <label class="form-label">Fecha de Inicio </label>
                                            <input th:classappend="${#fields.hasErrors('experiencias[1].fechaInicio')} ? 'is-invalid' : ''"
                                            type="date" th:field="*{experiencias[1].fechaInicio}" class="form-control">
                                        </div>
                        
                                        <div class="col-md-8">
                                            <label class="form-label">Descripción de Responsabilidades </label>
                                            <textarea th:classappend="${#fields.hasErrors('experiencias[1].descripcion')} ? 'is-invalid' : ''"
                                                th:field="*{experiencias[1].descripcion}" class="form-control"  placeholder="Describe tus principales logros y responsabilidades..." rows="2"></textarea>
                                            <span class="invalid-feedback" th:if="${#fields.hasErrors('experiencias[1].descripcion')}" th:errors="*{experiencias[1].descripcion}"></span>
                                        </div>
                                    </div>
                                </div>


                                <!-- Tercera Experiencia -->
                                <div id="experience3" class="experience-section">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <h6 class="fw-bold text-primary mb-0">Experiencia #3</h6>
                                        <button type="button" class="btn-close" onclick="toggleExperience(3)"></button>
                                    </div>

                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Nombre de la Empresa *</label>
                                            <input  class="form-control" placeholder="Ej. Goya Incol"  th:classappend="${#fields.hasErrors('experiencias[2].nombreEmpresa')} ? 'is-invalid' : ''" type="text" th:field="*{experiencias[2].nombreEmpresa}" required>
                                            <span class="invalid-feedback" th:if="${#fields.hasErrors('experiencias[2].nombreEmpresa')}" th:errors="*{experiencias[2].nombreEmpresa}"></span>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Cargo/Posición *</label>
                                            <input  class="form-control" placeholder="Ej. Consultor web" th:classappend="${#fields.hasErrors('experiencias[2].nombreCargo')} ? 'is-invalid' : ''" type="text" th:field="*{experiencias[2].nombreCargo}"required>
                                            <span class="invalid-feedback" th:if="${#fields.hasErrors('experiencias[2].nombreCargo')}" th:errors="*{experiencias[2].nombreCargo}"></span>
                                        </div>
                                    </div>

                                    <div class="row mb-3">
                                        <div class="col-md-4">
                                            <label class="form-label">Fecha de Inicio *</label>
                                            <input  type="date" th:field="*{experiencias[2].fechaInicio}" class="form-control" required>
                                        </div>
                        
                                        <div class="col-md-8">
                                            <label class="form-label">Descripción de Responsabilidades *</label>
                                            <textarea th:classappend="${#fields.hasErrors('experiencias[2].descripcion')} ? 'is-invalid' : ''"
                                                class="form-control" th:field="*{experiencias[2].descripcion}"   placeholder="Describe tus principales logros y responsabilidades..." rows="2" required></textarea>
                                            <span class="invalid-feedback" th:if="${#fields.hasErrors('experiencias[2].descripcion')}" th:errors="*{experiencias[2].descripcion}"></span>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="text-center">
                                        <button type="button" id="toggleBtn" class="btn btn-outline-primary btn-sm" onclick="toggleExperience(3)">
                                           
                                            + Agregar Experiencia
                                        </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- Botones -->
                <div class="d-flex flex-row-reverse mt-4 pt-3 border-top">
                    <button type="submit" class="btn btn-success px-4">
                       <i class="bi bi-check-circle me-1"></i> Guardar Curriculum
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>


  // Función para toggle: muestra/oculta y habilita/deshabilita controles internos
  function setDisabledForSection(section, disabled) {
  section.querySelectorAll('input, textarea, select').forEach(input => {
    input.disabled = disabled;
  });
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.experience-section').forEach(section => {
    setDisabledForSection(section, section.classList.contains('d-none'));
  });
});

function toggleExperience(num) {
  const section = document.getElementById(`experience${num}`);
  const isHidden = section.classList.toggle("d-none");
  setDisabledForSection(section, isHidden);

  const btn = document.getElementById("toggleBtn");
  btn.innerText = isHidden ? "+ Agregar Experiencia" : "- Quitar Experiencia";
}

//   function toggleExperience(num) {
//     const element = document.getElementById(`experience${num}`);
//     let btn = document.getElementById("toggleBtn");

//     if (!element) return;
//     if(element.classList.contains('d-none')){
//          element.querySelectorAll('input, textarea').forEach(input => input.value = '');
//     }
//     element.classList.toggle('d-none');
//     const hidden = element.classList.contains('d-none');
//     setDisabledForSection(element, hidden);

//     // Actualiza el texto del botón
  
//     if (btn.innerText.startsWith("+")) {
//         btn.innerText = "- Quitar Experiencia";
//     } else {
//         btn.innerText = "+ Agregar Experiencia";
//     }
//   }

  // Deshabilita/habilita todos los controles dentro de 'section'
  function setDisabledForSection(section, disabled) {
    const controls = section.querySelectorAll('input, textarea, select, button');
    controls.forEach(ctrl => {
      // evita deshabilitar botones de control interior que no deben afectarse
      if (ctrl.type === 'button' || ctrl.type === 'submit') return;

      // Guarda/restaura estado 'required' para no perder validaciones
      if (disabled) {
        if (ctrl.required) ctrl.dataset.required = 'true';
        ctrl.required = false;
      } else {
        if (ctrl.dataset.required === 'true') {
          ctrl.required = true;
          delete ctrl.dataset.required;
        }
      }

      ctrl.disabled = disabled;
    });
  }

  // Validación Bootstrap (mantenerla)
  (function() {
    'use strict';
    window.addEventListener('load', function() {
      var forms = document.getElementsByClassName('needs-validation');
      var validation = Array.prototype.filter.call(forms, function(form) {
        form.addEventListener('submit', function(event) {
          if (form.checkValidity() === false) {
            event.preventDefault();
            event.stopPropagation();
          }
          form.classList.add('was-validated');
        }, false);
      });
    }, false);
  })();
    </script>
</body>
</html>
