<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum Vitae</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Raleway:wght@300;500&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      font-family: 'Raleway', sans-serif;
      color: white;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('https://cdn.pixabay.com/photo/2022/12/11/11/43/building-7648743_1280.jpg') no-repeat center center/cover;
      filter: brightness(0.5) contrast(1.2); /* más oscuro y con contraste */
      z-index: -1;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 5rem;
      margin: 0;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 300;
      margin: 20px 0;
      max-width: 600px;
    }

    .btn {
      background: white;
      color: black;
      border: none;
      padding: 15px 40px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      border-radius: 4px;
    }

    .btn:hover {
      background: rgb(43, 105, 205);
      color: white;
    }
    a{
        text-decoration: none;
    }
    a:hover{
        color: white;
    }
    
  </style>
</head>
<body>

  <h1>Curriculum Vitae</h1>
  <h2>Crea tu currículum rápido, gratis</h2>

    <a th:href="@{/api/formulario}">
        <button  type="submit" class="btn">COMENZAR!</button>
    </a>

</body>
</html>
